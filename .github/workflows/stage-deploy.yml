name: Stage DB Deployment via IAP SSH

on:
  push:
    branches:
      - stage

permissions:
  id-token: write         # Required for Workload Identity Federation (WIF)
  contents: read          # Required for code checkout

jobs:
  deploy-via-iap:
    runs-on: ubuntu-latest

    env:
      DB_STAGE_URL: ${{ secrets.DB_STAGE_URL }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      BUILD_DIR: build-${{ github.run_number }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: ☁️ Authenticate to Google Cloud using WIF
        uses: google-github-actions/auth@v1
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/790726342913/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'liquibase-ci-cd-wif@liquibase-demo-001.iam.gserviceaccount.com'

      - name: ⚙️ Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: liquibase-demo-001

      - name: 🧰 Install PostgreSQL client (ecpg) and pgsanity
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pip install --user pgsanity
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 🔍 Validate raw SQL files with pgsanity
        run: |
          echo "🔍 Validating raw SQL files with pgsanity..."
          find ./db -name "*.sql" -print0 | xargs -0 pgsanity

      - name: 🔍 Validate Liquibase changelogs
        run: |
          echo "🔍 Validating Liquibase changelogs..."
          liquibase \
            --url='${{ env.DB_STAGE_URL }}' \
            --username='${{ env.DB_USER }}' \
            --password='${{ env.DB_PASS }}' \
            --changeLogFile=./db/changelog-master.xml \
            validate

      - name: 📂 Create build directory on VM
        run: |
          gcloud compute ssh ubuntu@${{ secrets.VM_NAME }} \
            --project=liquibase-demo-001 \
            --zone=${{ secrets.VM_ZONE }} \
            --tunnel-through-iap \
            --command="mkdir -p /opt/liquibase-project/${BUILD_DIR}"

      - name: 📤 Upload Liquibase changelogs to VM using IAP SCP
        run: |
          gcloud compute scp \
            --project=liquibase-demo-001 \
            --zone=${{ secrets.VM_ZONE }} \
            --tunnel-through-iap \
            --recurse ./db \
            ubuntu@${{ secrets.VM_NAME }}:/opt/liquibase-project/${BUILD_DIR}

      - name: 🚀 Run Liquibase update from VM via IAP SSH
        run: |
          gcloud compute ssh ubuntu@${{ secrets.VM_NAME }} \
            --project=liquibase-demo-001 \
            --zone=${{ secrets.VM_ZONE }} \
            --tunnel-through-iap \
            --command="cd /opt/liquibase-project/${BUILD_DIR}/db && \
              liquibase --url='${{ env.DB_STAGE_URL }}' \
                        --username='${{ env.DB_USER }}' \
                        --password='${{ env.DB_PASS }}' \
                        --changeLogFile=changelog-master.xml \
                        tag build-${GITHUB_RUN_NUMBER} && \
              liquibase --url='${{ env.DB_STAGE_URL }}' \
                        --username='${{ env.DB_USER }}' \
                        --password='${{ env.DB_PASS }}' \
                        --changeLogFile=changelog-master.xml \
                        --defaultSchemaName=public \
                        update --log-level=info"
