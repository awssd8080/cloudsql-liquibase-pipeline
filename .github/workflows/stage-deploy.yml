name: Stage DB Deployment via IAP SSH

on:
  workflow_dispatch:
    inputs:
      instance:
        description: 'Target DB instance (e.g. pricing, catalog)'
        required: true
        default: 'pricing'

permissions:
  id-token: write
  contents: read

jobs:
  liquibase-deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: liquibase-demo-001
      INSTANCE: ${{ github.event.inputs.instance }}
      BUILD_DIR: build-${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install ecpg for pgsanity
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pip install --user pgsanity

      - name: Run SQL syntax check (pgsanity)
        run: |
          echo "🔍 Validating SQL syntax..."
          find ./db -name "*.sql" -print0 | xargs -0 ~/.local/bin/pgsanity

      - name: Authenticate to Google Cloud using WIF
        uses: google-github-actions/auth@v1
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/790726342913/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'liquibase-ci-cd-wif@liquibase-demo-001.iam.gserviceaccount.com'

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Create build directory on VM
        run: |
          gcloud compute ssh ubuntu@${{ secrets.VM_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --zone=${{ secrets.VM_ZONE }} \
            --tunnel-through-iap \
            --command="mkdir -p /opt/liquibase-project/${{ env.BUILD_DIR }}"

      - name: Upload Liquibase changelogs to VM using IAP SCP
        run: |
          gcloud compute scp \
            --project=${{ env.PROJECT_ID }} \
            --zone=${{ secrets.VM_ZONE }} \
            --tunnel-through-iap \
            --recurse ./db \
            ubuntu@${{ secrets.VM_NAME }}:/opt/liquibase-project/${{ env.BUILD_DIR }}

      - name: Run Liquibase from inside GCP VM via IAP SSH
        run: |
          DB_URL=${{ secrets['DB_URL_' + env.INSTANCE | upper] }}
          DB_USER=${{ secrets['DB_USER_' + env.INSTANCE | upper] }}
          DB_PASS=${{ secrets['DB_PASS_' + env.INSTANCE | upper] }}

          gcloud compute ssh ubuntu@${{ secrets.VM_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --zone=${{ secrets.VM_ZONE }} \
            --tunnel-through-iap \
            --command="cd /opt/liquibase-project/${{ env.BUILD_DIR }}/db && \
              liquibase --url='${DB_URL}' \
                        --username='${DB_USER}' \
                        --password='${DB_PASS}' \
                        --changeLogFile=changelog-master.xml \
                        tag build-${GITHUB_RUN_NUMBER} && \
              liquibase --url='${DB_URL}' \
                        --username='${DB_USER}' \
                        --password='${DB_PASS}' \
                        --changeLogFile=changelog-master.xml \
                        --defaultSchemaName=public \
                        update --log-level=info"
