name: Stage DB Deployment via IAP SSH

on:
  push:
    branches:
      - stage

permissions:
  id-token: write
  contents: read

jobs:
  liquibase-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        instance: [pricing, catalog]

    env:
      BUILD_DIR: build-${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install pgsanity
        run: |
          python3 -m pip install --upgrade pip
          pip install pgsanity

      - name: Validate SQL syntax with pgsanity
        run: |
          echo "🔍 Validating SQL syntax..."
          find db/ -name "*.sql" -print0 | xargs -0 -n1 pgsanity

      - name: Authenticate to Google Cloud using WIF
        uses: google-github-actions/auth@v1
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/790726342913/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'liquibase-ci-cd-wif@liquibase-demo-001.iam.gserviceaccount.com'

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: liquibase-demo-001

      - name: Set DB and VM values based on matrix.instance
        run: |
          if [ "${{ matrix.instance }}" = "pricing" ]; then
            echo "DB_URL=${{ secrets.DB_URL_PRICING }}" >> $GITHUB_ENV
            echo "DB_USER=${{ secrets.DB_USER_PRICING }}" >> $GITHUB_ENV
            echo "DB_PASS=${{ secrets.DB_PASS_PRICING }}" >> $GITHUB_ENV
            echo "VM_NAME=liquibase-pricing-vm" >> $GITHUB_ENV
            echo "VM_ZONE=us-central1-a" >> $GITHUB_ENV
            echo "CHANGELOG_FILE=changelog-pricing.xml" >> $GITHUB_ENV
          elif [ "${{ matrix.instance }}" = "catalog" ]; then
            echo "DB_URL=${{ secrets.DB_URL_CATALOG }}" >> $GITHUB_ENV
            echo "DB_USER=${{ secrets.DB_USER_CATALOG }}" >> $GITHUB_ENV
            echo "DB_PASS=${{ secrets.DB_PASS_CATALOG }}" >> $GITHUB_ENV
            echo "VM_NAME=liquibase-catalog-vm" >> $GITHUB_ENV
            echo "VM_ZONE=us-east1-b" >> $GITHUB_ENV
            echo "CHANGELOG_FILE=changelog-catalog.xml" >> $GITHUB_ENV
          fi

      - name: Create build directory on VM
        run: |
          gcloud compute ssh ubuntu@$VM_NAME \
            --project=liquibase-demo-001 \
            --zone=$VM_ZONE \
            --tunnel-through-iap \
            --command="mkdir -p /opt/liquibase-project/$BUILD_DIR"

      - name: Upload changelogs to VM
        run: |
          gcloud compute scp \
            --project=liquibase-demo-001 \
            --zone=$VM_ZONE \
            --tunnel-through-iap \
            --recurse ./db \
            ubuntu@$VM_NAME:/opt/liquibase-project/$BUILD_DIR

      - name: Run Liquibase (status, validate, updateSQL, tag, update)
        run: |
          gcloud compute ssh ubuntu@$VM_NAME \
            --project=liquibase-demo-001 \
            --zone=$VM_ZONE \
            --tunnel-through-iap \
            --command="cd /opt/liquibase-project/$BUILD_DIR/db && \
              liquibase --url='$DB_URL' \
                        --username='$DB_USER' \
                        --password='$DB_PASS' \
                        --changeLogFile=$CHANGELOG_FILE \
                        status && \
              liquibase --url='$DB_URL' \
                        --username='$DB_USER' \
                        --password='$DB_PASS' \
                        --changeLogFile=$CHANGELOG_FILE \
                        validate && \
              liquibase --url='$DB_URL' \
                        --username='$DB_USER' \
                        --password='$DB_PASS' \
                        --changeLogFile=$CHANGELOG_FILE \
                        updateSQL && \
              liquibase --url='$DB_URL' \
                        --username='$DB_USER' \
                        --password='$DB_PASS' \
                        --changeLogFile=$CHANGELOG_FILE \
                        tag build-${GITHUB_RUN_NUMBER} && \
              liquibase --url='$DB_URL' \
                        --username='$DB_USER' \
                        --password='$DB_PASS' \
                        --changeLogFile=$CHANGELOG_FILE \
                        update"
