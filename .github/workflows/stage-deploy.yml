name: Stage DB Deployment via IAP SSH

on:
  push:
    branches:
      - stage

jobs:
  deploy-via-iap:
    runs-on: ubuntu-latest
    env:
      DB_STAGE_URL: ${{ secrets.DB_STAGE_URL }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      BUILD_DIR: build-${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.PROJECT_ID }}

      - name: Prepare SSH key and generate public key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem
          ssh-keygen -y -f key.pem > key.pem.pub

      - name: Create build directory under /opt/liquibase-project on VM
        run: |
          gcloud compute ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.VM_NAME }} \
            --project=${{ secrets.PROJECT_ID }} \
            --zone=${{ secrets.VM_ZONE }} \
            --ssh-key-file=key.pem \
            --tunnel-through-iap \
            --command="mkdir -p /opt/liquibase-project/${BUILD_DIR}"

      - name: Upload Liquibase changelogs to VM using IAP SCP
        run: |
          gcloud compute scp \
            --project=${{ secrets.PROJECT_ID }} \
            --zone=${{ secrets.VM_ZONE }} \
            --tunnel-through-iap \
            --ssh-key-file=key.pem \
            --recurse ./db \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.VM_NAME }}:/opt/liquibase-project/${{ env.BUILD_DIR }}

      - name: Run Liquibase from inside GCP VM via IAP SSH
        run: |
          gcloud compute ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.VM_NAME }} \
            --project=${{ secrets.PROJECT_ID }} \
            --zone=${{ secrets.VM_ZONE }} \
            --ssh-key-file=key.pem \
            --tunnel-through-iap \
            --command="cd /opt/liquibase-project/${BUILD_DIR}/db && \
              liquibase --url='${{ secrets.DB_STAGE_URL }}' \
                        --username='${{ secrets.DB_USER }}' \
                        --password='${{ secrets.DB_PASS }}' \
                        --changeLogFile=changelog-master.xml \
                        tag build-${GITHUB_RUN_NUMBER} && \
              liquibase --url='${{ secrets.DB_STAGE_URL }}' \
                        --username='${{ secrets.DB_USER }}' \
                        --password='${{ secrets.DB_PASS }}' \
                        --changeLogFile=changelog-master.xml \
                        update"
