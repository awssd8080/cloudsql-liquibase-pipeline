name: Stage DB Deployment via IAP SSH

on:
  push:
    branches:
      - stage

jobs:
  deploy-via-iap:
    runs-on: ubuntu-latest
    env:
      DB_STAGE_URL: ${{ secrets.DB_STAGE_URL }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install gcloud + IAP components
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.PROJECT_ID }}
          install_components: iap

      - name: Upload changelogs to GCP VM via IAP SCP
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

          gcloud compute scp --recurse ./db \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.VM_NAME }}:/home/${{ secrets.SSH_USERNAME }}/liquibase \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.PROJECT_ID }} \
            --ssh-key-file=key.pem \
            --tunnel-through-iap

      - name: Run Liquibase inside GCP VM via IAP SSH
        run: |
          gcloud compute ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.VM_NAME }} \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.PROJECT_ID }} \
            --ssh-key-file=key.pem \
            --tunnel-through-iap \
            --command="cd liquibase/db && \
              liquibase --url='${{ secrets.DB_STAGE_URL }}' \
                        --username='${{ secrets.DB_USER }}' \
                        --password='${{ secrets.DB_PASS }}' \
                        --changeLogFile=changelog-master.xml \
                        tag build-${GITHUB_RUN_NUMBER} && \
              liquibase --url='${{ secrets.DB_STAGE_URL }}' \
                        --username='${{ secrets.DB_USER }}' \
                        --password='${{ secrets.DB_PASS }}' \
                        --changeLogFile=changelog-master.xml \
                        update"
